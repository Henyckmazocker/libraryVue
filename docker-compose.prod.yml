services:
  frontend:
    container_name: libraryvue-frontend-prod
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.frontend.prod
      args:
        VUE_APP_API_URL: https://library.dcahomelab.com/api
        VUE_APP_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    ports:
      - "8082:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - library_network
    restart: always

  backend:
    container_name: libraryvue-backend-prod
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.backend.prod
    expose:
      - "80"
    volumes:
      # Solo volúmenes persistentes, NO bind mounts de código
      - backend_storage:/var/www/html/storage
      # Aparte de backend_storage, que ya cubre logs y sesiones: la caché de
      # portadas puede ocupar GB y se tira entera sin tocar el resto.
      - covers_data:/var/www/html/storage/covers
      - backend_vendor:/var/www/html/vendor
    environment:
      - APP_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=library_db_prod
      - DB_USERNAME=library_user
      - DB_PASSWORD=${DB_PASSWORD}
      # Mirror de catálogos: el MISMO que usa dev (docker-compose.mirror.yml).
      # No es opcional — sin él, search_movies_omdb y search_spotify_albums no
      # degradan a red: MySqlMovieCatalog no captura la PDOException y responde
      # 500. Usuario propio porque este servidor lo comparten los dos entornos.
      - DB_MIRROR_HOST=mirror-mysql
      - DB_MIRROR_PORT=3306
      - DB_MIRROR_DATABASE=library_mirror
      - DB_MIRROR_USERNAME=library_mirror_user
      - DB_MIRROR_PASSWORD=${DB_MIRROR_PASSWORD}
      - LOG_PATH=/var/www/html/storage/logs
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - LASTFM_API_KEY=${LASTFM_API_KEY}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      # TMDB sustituye a OMDb: OmdbService ya no existe. Es la capa de
      # enriquecimiento del mirror (sinopsis en español, póster y director), y
      # sin la clave las fichas de película salen desnudas.
      - TMDB_API_KEY=${TMDB_API_KEY}
      - CORS_ALLOWED_ORIGINS=https://library.dcahomelab.com
    command: >
      bash -c "cd /var/www/html && 
               cp .env.docker-production .env &&
               export COMPOSER_MEMORY_LIMIT=-1 &&
               composer install --no-dev --optimize-autoloader --no-interaction &&
               mkdir -p storage/logs storage/cache storage/sessions storage/uploads storage/covers &&
               chown -R www-data:www-data storage/ &&
               chmod -R 775 storage/ &&
               apache2-foreground"
    depends_on:
      - mysql
    networks:
      - library_network
      - library_mirror_net
    restart: always

  mysql:
    container_name: libraryvue-mysql-prod
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: library_db_prod
      MYSQL_USER: library_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # NO usar --init-file: ejecutaría init.prod.sql (que hace DROP DATABASE) en
    # CADA arranque y borraría los datos. init.prod.sql se monta en
    # docker-entrypoint-initdb.d, que solo corre la primera vez (volumen vacío).
    restart: always
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ./docker/database/init.prod.sql:/docker-entrypoint-initdb.d/init.prod.sql
    networks:
      - library_network

networks:
  library_network:
    driver: bridge
  # El mirror es un servicio compartido con dev, en su propio stack. Externa
  # porque no la posee ninguno de los dos entornos.
  library_mirror_net:
    external: true
    name: library_mirror_net

volumes:
  mysql_data_prod:
  backend_vendor:
  backend_storage:
  # Compartido con dev, y por eso externo. cover_file vive en el mirror, que
  # también es compartido: su storage_path ('ab/ab3f...jpg') es relativo a ESTE
  # volumen, así que si cada entorno tuviera el suyo, la fila que escribe dev
  # apuntaría en prod a un fichero inexistente. Y no fallaría de forma ruidosa:
  # CoverStore::localPath() haría is_file() -> null -> 302 al CDN, y como
  # claimPending() filtra por storage_path IS NULL, prod no volvería a bajarla
  # nunca. Producción servida desde el CDN ajeno en silencio.
  covers_data:
    external: true
    name: library_covers_data
