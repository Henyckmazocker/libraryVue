
services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.frontend.dev
    ports:
      - "8080:8080"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/babel.config.js:/app/babel.config.js
      - ./frontend/jsconfig.json:/app/jsconfig.json
      - ./frontend/vue.config.js:/app/vue.config.js
      # Arnés de tests (Vitest). package.json se monta para que el script "test"
      # esté disponible sin reconstruir; las devDeps sí viven en la imagen, así
      # que añadir una dependencia nueva sigue pidiendo `docker compose build frontend`.
      - ./frontend/package.json:/app/package.json
      - ./frontend/vitest.config.js:/app/vitest.config.js
      - ./frontend/tests:/app/tests
      # Barrera de estilos (stylelint). Se monta por lo mismo que vitest.config.js:
      # para poder tocar las reglas sin reconstruir la imagen.
      - ./frontend/.stylelintrc.json:/app/.stylelintrc.json
    environment:
      - NODE_ENV=development
      - VUE_APP_API_URL=http://127.0.0.1:8888/index.php
      - VUE_APP_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.backend.dev
    ports:
      - "8888:80"
    volumes:
      # Mapear todo el directorio backend al DocumentRoot de Apache
      - ./backend:/var/www/html
      # Mapear específicamente vendor como volumen para performance
      - backend_vendor:/var/www/html/vendor
      # Compartido con el MySQL del mirror: LOAD DATA INFILE lee del disco del
      # SERVIDOR, y el importador (bin/mirror) corre aquí. Es secure_file_priv,
      # no un capricho. Externo porque los dos extremos están en stacks distintos.
      - mirror_files:/var/lib/mysql-files
      # Portadas descargadas. Volumen NOMBRADO y no parte del bind mount de
      # ./backend a propósito: son datos, no código, y dentro del árbol del
      # repo acabarían en `git status` como pasa con storage/ratelimit/.
      # Compartido con producción: cover_file vive en el mirror y su storage_path
      # tiene que significar lo mismo en los dos entornos.
      - covers_data:/var/www/html/storage/covers
      # El esquema, para la suite de integración: `tests/Integration/bootstrap.php`
      # siembra la base desechable con init.sql + las migraciones, y esos ficheros
      # viven FUERA de ./backend. Solo lectura, y en /opt y no bajo /var/www/html
      # a propósito: dentro del DocumentRoot, Apache serviría el esquema entero
      # en texto plano a quien pidiera /docker/database/init.sql.
      - ./docker/database:/opt/db-schema:ro
    environment:
      - APP_ENV=development
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=library_db
      # El mirror vive en su propio stack (docker-compose.mirror.yml), compartido
      # con producción. Host y credenciales propios: un servidor MySQL tiene una
      # sola contraseña por usuario, y la de library_user aquí no es la de prod.
      - DB_MIRROR_HOST=mirror-mysql
      - DB_MIRROR_PORT=3306
      - DB_MIRROR_DATABASE=library_mirror
      - DB_MIRROR_USERNAME=library_mirror_user
      - DB_MIRROR_PASSWORD=${DB_MIRROR_PASSWORD}
      - DB_MIRROR_IMPORT_USER=library_mirror_importer
      - DB_MIRROR_IMPORT_PASSWORD=${DB_MIRROR_IMPORT_PASSWORD}
      - DB_USERNAME=library_user
      - DB_PASSWORD=${DB_PASSWORD}
      # La BD desechable de la suite de integración. Van aquí y no hardcodeadas
      # en el bootstrap para que cambiar el servicio no obligue a tocar PHP.
      # `DB_TEST_HOST` es además la guarda: el bootstrap se NIEGA a sembrar si
      # no está apuntando aquí, porque init.sql empieza con un DROP DATABASE.
      - DB_TEST_HOST=mysql-test
      - DB_TEST_PORT=3306
      - DB_TEST_DATABASE=library_db
      - DB_TEST_USERNAME=root
      - DB_TEST_PASSWORD=test
      - LOG_PATH=/var/www/html/storage/logs
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - LASTFM_API_KEY=${LASTFM_API_KEY}
      - TMDB_API_KEY=${TMDB_API_KEY}
    command: >
      bash -c "cd /var/www/html && 
               cp .env.docker-development .env &&
               export COMPOSER_MEMORY_LIMIT=-1 &&
               composer install --optimize-autoloader --no-interaction &&
               mkdir -p storage/logs storage/cache storage/sessions storage/uploads storage/covers &&
               chown -R www-data:www-data storage/ &&
               chmod -R 775 storage/ &&
               apache2-foreground"
    depends_on:
      - mysql
    networks:
      - default
      - library_mirror_net
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: library_db
      MYSQL_USER: library_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # NO usar --init-file: ejecutaría init.sql (que hace DROP DATABASE) en CADA
    # arranque y borraría los datos. init.sql se monta en docker-entrypoint-initdb.d,
    # que solo corre la primera vez (volumen vacío). Eso basta para inicializar.
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/database/init.sql:/docker-entrypoint-initdb.d/init.sql

  # MySQL desechable para la suite de integración. NO va en
  # docker-compose.prod.yml: producción no debe ni saber que existe.
  mysql-test:
    image: mysql:8.0        # la MISMA que dev, no `mysql:8`
    # SIN puerto publicado, y a propósito: la suite corre DENTRO del contenedor
    # `backend` y llega por la red de compose, así que exponerlo al host no
    # aporta nada y sí quita. El 3309 que proponía el plan ya lo tiene el MySQL
    # de statcoin (comprobado el 2026-08-25), y cualquier otro que se elija hoy
    # puede chocar mañana con otro proyecto del workspace. Sin publicar, no hay
    # colisión posible — ni forma de conectarse a la base de test por error
    # creyendo que es la de dev.
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: library_db
    # En RAM, y eso no es un lujo: una suite de integración abre y revierte
    # transacciones cientos de veces. Y garantiza lo que promete el nombre —
    # al parar el contenedor no queda absolutamente nada, sin volumen que
    # limpiar ni `down -v` que recordar. Medido: acepta conexiones en 8 s.
    tmpfs:
      - /var/lib/mysql
    # `init.sql` NO se monta en docker-entrypoint-initdb.d como en el servicio
    # de dev: siembra `tests/Integration/bootstrap.php`, que además aplica las
    # migraciones (init.sql por sí solo no es el esquema actual) y comprueba
    # contra qué host está antes de tocar nada.
    restart: "no"
    profiles: ["test"]

networks:
  # Creada por `./mirror-sync.sh --bootstrap`, no por este stack: la comparten
  # dev, prod y el propio mirror, y ninguno de los tres debe ser su dueño.
  library_mirror_net:
    external: true
    name: library_mirror_net

volumes:
  mysql_data:
  backend_vendor:
  # Los dos externos se comparten con el stack del mirror y con producción.
  # `external: true` es además la red de seguridad: así un `docker compose
  # down -v` aquí no puede llevarse las portadas ni el área de importación.
  mirror_files:
    external: true
    name: library_mirror_files
  covers_data:
    external: true
    name: library_covers_data

# Optional named volume for node_modules if you choose Option 2 above
# volumes:
#   node_modules_volume: