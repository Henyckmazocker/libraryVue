# Rate limiting zone for the API (infra-level defense in depth).
# Keyed by the real client IP (resolved below via real_ip_header CF-Connecting-IP).
# Fine-grained limits (login, external API quotas) are enforced by the PHP
# RateLimitMiddleware; this is a coarse blanket limit to protect the backend.
#
# Cover requests are exempt, and that is not a loophole. `GET /api?cover=…` is
# the one non-POST route (backend/public/cover.php): it is dispatched before
# bootstrap.php, touches neither the session nor library_db, and just reads a
# file off disk. But /library paints a grid — 50 items means 50 parallel GETs,
# which would blow through burst=20 and leave the page full of broken covers.
# An empty key makes nginx skip the limit for that request, which is exactly
# what the map below produces for them.
map $arg_cover $api_limit_key {
    default $binary_remote_addr;
    ~.+     "";
}
limit_req_zone $api_limit_key zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name library.dcahomelab.com;
    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare real IP configuration
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Proxy API requests to backend
    # Rewrite /api and /api/ to /index.php and proxy to backend
    location /api {
        # Blanket rate limit: ~10 req/s per IP with short bursts allowed.
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        rewrite ^/api/?$ /index.php break;
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Handle SPA routing - redirect all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Handle static files with aggressive caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    
    # Content Security Policy
    # connect-src: la API propia, Google OAuth, Google Books y Open Library (el
    # fallback de useWorkSearch.js, la única llamada del frontend que no pasa por
    # auth.apiCall). Ni TMDB ni MusicBrainz aparecen: los consulta el backend.
    # cdnjs ya no está — FontAwesome se sirve desde el propio origen, tanto en la
    # SPA (paquete npm) como en las páginas estáticas (/vendor/fontawesome).
    # img-src mantiene https: porque las portadas que aún no tienen copia local
    # responden 302 al CDN de origen (TMDB, Open Library, IGDB…).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://library.dcahomelab.com https://www.googleapis.com https://accounts.google.com https://openlibrary.org https://covers.openlibrary.org; frame-src https://accounts.google.com;" always;

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Custom error pages (opcional)
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
