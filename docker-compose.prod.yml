version: '3.8'

services:
  frontend:
    container_name: libraryvue-frontend-1
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.frontend.prod
      args:
        VUE_APP_API_URL: https://library.dcahomelab.com/api
        VUE_APP_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    ports:
      - "8082:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - library_network
    restart: always

  backend:
    container_name: libraryvue-backend-1
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.backend.prod
    expose:
      - "80"
    volumes:
      # Solo volúmenes persistentes, NO bind mounts de código
      - backend_storage:/var/www/html/storage
      - backend_vendor:/var/www/html/vendor
    environment:
      - APP_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=library_db_prod
      - DB_USERNAME=library_user
      - DB_PASSWORD=${DB_PASSWORD}
      - LOG_PATH=/var/www/html/storage/logs
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - CORS_ALLOWED_ORIGINS=https://library.dcahomelab.com
    command: >
      bash -c "cd /var/www/html && 
               cp .env.docker-production .env &&
               export COMPOSER_MEMORY_LIMIT=-1 &&
               composer install --no-dev --optimize-autoloader --no-interaction &&
               mkdir -p storage/logs storage/cache storage/sessions storage/uploads &&
               chown -R www-data:www-data storage/ &&
               chmod -R 775 storage/ &&
               apache2-foreground"
    depends_on:
      - mysql
    networks:
      - library_network
    restart: always

  mysql:
    container_name: libraryvue-mysql-prod
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: library_db_prod
      MYSQL_USER: library_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --init-file /docker-entrypoint-initdb.d/init.prod.sql
    restart: always
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ./docker/database/init.prod.sql:/docker-entrypoint-initdb.d/init.prod.sql
    networks:
      - library_network

networks:
  library_network:
    driver: bridge

volumes:
  mysql_data_prod:
  backend_vendor:
  backend_storage:
