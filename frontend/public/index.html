<!DOCTYPE html>
<html lang="">
  <head>
    <!-- El SDK de Google Identity NO se carga aquí: lo inyecta
         `composables/useGoogleAuth.js` la primera vez que hace falta, es decir
         solo cuando hay que pintar el botón de login. Traerlo en cada carga de
         página costaba una petición a accounts.google.com también a los usuarios
         con sesión abierta y a la app Capacitor, que usa el login nativo. -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title>Library</title>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but Library doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
