# Los 28 estados de la biblioteca, tal como los manda el backend: el slug es la
# clave y viaja SIEMPRE en inglés — traducir es cosa del cliente. Salen de las cinco
# acciones `get_*_allowed_statuses`, comprobadas contra dev el 2026-08-31.
#
# Ojo: hay pares que comparten traducción en español y no en inglés —`dropped` y
# `abandoned`, `viewed` y `watched`, `on-hold` y `paused`—. Es correcto: son estados
# distintos para el backend y la comparación va SIEMPRE por slug, nunca por texto.
status:
  "100-completed": Completado al 100 %
  "abandoned": Abandonado
  "backlog": Pendiente
  "completed": Completado
  "dropped": Abandonado
  "favorite": Favorito
  "in-watchlist": En lista de ver
  "in-wishlist": En lista de deseos
  "listened": Escuchado
  "listening": Escuchando
  "on-hold": En pausa
  "owned": En propiedad
  "paused": En pausa
  "played": Jugado
  "playing": Jugando
  "re-listening": Reescuchando
  "re-reading": Releyendo
  "re-watching": Reviendo
  "read": Leído
  "reading": Leyendo
  "saved": Guardado
  "to-read": Por leer
  "viewed": Visto
  "want-to-buy": Quiero comprarlo
  "want-to-listen": Quiero escucharlo
  "want-to-watch": Quiero verlo
  "watched": Visto
  "watching": Viendo

