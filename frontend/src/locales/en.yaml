# The 28 library statuses. The slug is the key and always travels in English:
# translating is the client's job. Mind the pairs that share a Spanish wording but
# not an English one — `dropped`/`abandoned`, `viewed`/`watched`, `on-hold`/`paused`.
status:
  "100-completed": 100 % completed
  "abandoned": Abandoned
  "backlog": Backlog
  "completed": Completed
  "dropped": Dropped
  "favorite": Favourite
  "in-watchlist": In watchlist
  "in-wishlist": In wishlist
  "listened": Listened
  "listening": Listening
  "on-hold": On hold
  "owned": Owned
  "paused": Paused
  "played": Played
  "playing": Playing
  "re-listening": Re-listening
  "re-reading": Re-reading
  "re-watching": Re-watching
  "read": Read
  "reading": Reading
  "saved": Saved
  "to-read": To read
  "viewed": Viewed
  "want-to-buy": Want to buy
  "want-to-listen": Want to listen
  "want-to-watch": Want to watch
  "watched": Watched
  "watching": Watching

